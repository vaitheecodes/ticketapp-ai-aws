# Local PostgreSQL for the test suite, as an alternative to
# scripts/pg_local.sh (Homebrew). UNVERIFIED: Docker wasn't available
# when this was written; the suite was run against scripts/pg_local.sh.
#
#   docker compose up -d
#   DB_BACKEND=postgres TEST_DATABASE_URL=postgresql://ticketapp:ticketapp-local-test-only@127.0.0.1:5433/ticketapp_test pytest
#
# The password exists only for this local, loopback-only test database.
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ticketapp
      POSTGRES_PASSWORD: ticketapp-local-test-only
      POSTGRES_DB: ticketapp_test
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketapp -d ticketapp_test"]
      interval: 2s
      timeout: 3s
      retries: 15
