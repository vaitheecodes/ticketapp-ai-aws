# Builds the React frontend and deploys it to the existing Static Web App
# (ticketapp-web) on every push to main that touches frontend/.
#
# VITE_API_URL is inlined at build time, so the build points at the
# production backend. The build happens here (skip_app_build), and the
# built folder is uploaded as-is, including staticwebapp.config.json.
#
# Secret: AZURE_STATIC_WEB_APPS_API_TOKEN — the Static Web App's
# deployment token.
name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Vite 8 needs Node ^20.19 or >=22.12.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_URL: https://ticketapp-ai-api.azurewebsites.net/api

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ""
          skip_app_build: true
          skip_api_build: true
